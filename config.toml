#
# Configurazione unica. La scelta del telescopio avviene selezionando
# il profilo dentro PHD2 (focale -> pixel scale auto-rilevata).
# Vedi NOTE_CLAUDE.md sezione 22 per il refactor a config unico.
#
# Per editare un parametro: trovare la sezione, leggere il commento
# inline, modificare il valore. Le sezioni feature-specific (es.
# [auto_calibration], [exposure_dynamic]) hanno default attivi.
#

[setup]
profile_name                     = "auto"
guide_pixel_scale_arcsec_native  = 1.0    # fallback se PHD2 non riporta la scala
guide_pixel_scale_arcsec_reduced = 1.0    # fallback
reducer_active                   = false

[phd2]
host = "localhost"
port = 4400

[dashboard]
host = "0.0.0.0"
port = 8080

[control]
dry_run          = false
interval_seconds = 10
window_frames    = 30
cooldown_seconds = 30
# §34: accumula baseline e popola i campi di logging per OGNI guide-frame (non solo
# sul tick da interval_seconds). Risolve la baseline lenta (~37 -> ~8 min) e
# l'"85% INSUFFICIENT" artefatto (in realta' ~15% sui frame valutati).
per_frame_baseline = true
# §50 — INIT ai valori standard PHD2 all'inizio guida (stato iniziale NOTO → log dei tester
# confrontabili): RA (Hysteresis) aggr 70 / MinMove 0.20; DEC (Resist Switch) aggr 100 /
# MinMove 0.20. Algoritmo-aware (skip+warning se l'asse usa un algoritmo a scala diversa).
# I valori utente sono salvati dal Baseline Guardian e ripristinati allo shutdown pulito.
# false = eredita i valori PHD2 correnti come oggi.
init_to_phd2_standard = true

[analyzer]
# §36 — FIX UNITÀ: le distanze di guida di PHD2 (RADistanceRaw/DECDistanceRaw) sono in
# PIXEL, mentre soglie/cap/reject sono in arcsec. Con true l'ingest converte la misura
# px→arcsec (× pixel-scale viva) così misura e soglie combaciano su tutti i setup
# (RC8 non sovrastima piu', Askar/Mirko non sottostimano). SHIPPED ON: un fix di
# correttezza non gira col bug. false = misura in px (buggato), solo per A/B.
convert_distance_to_arcsec = true

[thresholds]
rms_high           = 1.20   # iniziale/fallback; sovrascritto dall'auto-calibrazione
rms_low            = 0.60   # iniziale/fallback
snr_low            = 8.0    # unificato: sopra il cuscinetto PHD2 (6.0) e il reject (3.0),
                            #            sotto la fascia sana 15-40 -> scatta solo a degrado reale
spike_ratio_high   = 0.30
consecutive_frames = 5

[emergency]
auto_recovery        = true
max_exposure_ms      = 4000   # unificato a 4s per tutti i setup
find_star_delay      = 10
saturation_timeout_s = 300

# §51 — CAP MinMove ADATTIVO (chiavi scalari sotto [limits], PRIMA delle sottotabelle
# [limits.ra]/[limits.dec]). Il MinMove può salire per assorbire il seeing ma mai oltre
# ciò che il setup può raggiungere (k × baseline §44 FILTRATA nel tempo) né oltre il
# requisito di imaging (imaging_ceiling). cap_arcsec = min(k×baseline_filtrata, ceiling);
# cap_px = cap_arcsec / pixel_scale. Applicato su RA+DEC e a tutti i punti che alzano MinMove.
[limits]
minmove_cap_adaptive_enabled   = true    # kill-switch (false = solo minmove_max legacy)
minmove_cap_baseline_factor    = 0.8     # k UNIVERSALE (<1): rapporto dead-band/RMS raggiungibile → scale-indipendente
minmove_imaging_ceiling_arcsec = 2.0     # tetto imaging per-setup (stub N5); default generoso. RC8 0.5"/px più stringente
baseline_filter_tau_minutes    = 18.0    # costante di tempo dell'EMA sulla baseline §44 (~decine di minuti)

# Range armonizzati RA/DEC (§24): i due blocchi sono identici.
# §43b: aggr_max 90 -> 100 (tetto pieno di reattività; osservazione di campo a guida
# stabile). È solo un TETTO: CASO3 / satisfaction-gate §30 / rilevatore OVERCORRECTION
# governano il valore reale. NB: minmove_max NON è una % (è una distanza px/arcsec):
# resta 0.85 — 100 disattiverebbe di fatto la guida.
[limits.ra]
aggr_min       = 35
aggr_max       = 100
aggr_step_down = 5
aggr_step_up   = 2
minmove_min    = 0.15
minmove_max    = 0.85
minmove_step   = 0.05

[limits.dec]
aggr_min       = 35
aggr_max       = 100
aggr_step_down = 5
aggr_step_up   = 2
minmove_min    = 0.15
minmove_max    = 0.85
minmove_step   = 0.05

[logging]
csv_dir   = "logs"
log_level = "INFO"

[phd2_log]
log_dir     = ""
output_dir  = "phd2_log"
auto_import = true

[exposure_dynamic]
enabled               = true
step_factor           = 1.5
max_steps_above_base  = 2
cooldown_s            = 90
spike_min             = 0.25   # unificato (mediana dei 3 setup: 0.30/0.25/0.20)
hfd_min_arcsec        = 4.0    # unificato (mediana dei 3 setup: 4.5/4.0/4.0)
peak_to_rms_ratio_min = 3.0
nominal_for_seconds   = 60
# §35: se Path B alza l'esposizione e la stella SATURA al nuovo tempo, riseleziona
# proattivamente una stella non satura (entro pochi secondi, non i 300s del timer).
restar_on_pathb_saturation = true   # ATTIVO (shipped ON)
pathb_restar_settle_frames = 2      # frame (x durata esposizione) di settle prima del check
pathb_restar_cooldown_s    = 120    # anti-flapping fra riselezioni

[auto_calibration]
enabled                       = true
use_phd2_pixel_scale          = true
# Taratura §25: cuscinetto sopra baseline ridotto dal 50% al 30% per protezione
# focali lunghe (es. RC8 a 0,51"/px, dove 1,5 x baseline tipica = soglie gia' fuori scala).
rms_high_factor               = 1.3        # era 1.5 (§24)
rms_low_factor                = 0.75
baseline_window_frames        = 60
# §40 — 6.0 = pavimento "Minimum star SNR for AutoFind" di default di PHD2 (lo ha ogni
# utente) -> la baseline si forma per tutti. Resta <= snr_low (8): 6 = soglia rilevamento
# stella, 8 = soglia controllo esposizione. Prima 10.0 bloccava le notti a SNR basso.
baseline_min_snr              = 6.0
# --- Clamp proporzionale del cap su rms_high (§23, taratura aggiornata §24) ---
# cap_efficace = clamp(rms_high_max_factor * pixel_scale, rms_high_min_arcsec, rms_high_max_arcsec)
# Tetto a 1,00" allineato al benchmark di "guida pulita" universalmente riconosciuto:
# risolve il caso cercatore-guida (focale di guida != imaging) impedendo che la pixel scale
# grossolana del cercatore porti a soglie troppo lasche per l'ottica di ripresa.
# Effetto: su RC8/Tecnosky/Askar il cap risulta 1,00" (il proporzionale verrebbe 1,02/2,06/3,16 -> troncato).
rms_high_max_factor           = 2.0
rms_high_min_arcsec           = 0.70
rms_high_max_arcsec           = 1.00
# Floor su rms_low:
rms_low_min_arcsec            = 0.25
# --- Gate di rifiuto baseline (§23) ---
# reject se baseline > max(baseline_reject_min_arcsec, baseline_reject_factor * pixel_scale)
# Esempi: RC8 reject > 1,53"; Tecnosky > 3,09"; Askar > 4,74".
baseline_reject_factor        = 3.0
baseline_reject_min_arcsec    = 1.50
# --- Refresh ciclico baseline (§25, modalità LEGACY) ---
# Usato SOLO con baseline_track_bidirectional=false: la baseline si ri-misura ogni
# refresh_interval_seconds e sostituisce la corrente solo se più stretta ("tightest-wins").
refresh_enabled               = true
refresh_interval_seconds      = 1800.0     # 30 minuti
refresh_only_if_tighter       = true
# --- §44: baseline a rinnovo CONTINUO e BIDIREZIONALE (shipped ON) ---
# true: la baseline si aggiorna in continuo su finestra mobile (best-fraction, liscia) e
# può SALIRE col peggiorare del seeing (un RMS alto-ma-stabile per la notte resta NOMINAL,
# niente softening leve spurio) o stringersi col migliorare → soglie sulla scala REALE
# della serata. Sostituisce l'attesa refresh_interval + tightest-wins §25.
# false = legacy §25 (refresh ciclico 1800s, solo-se-più-stretta).
# Il CAP §24 (tetto rms_high) e il gate di rifiuto §23 restano attivi in entrambi i casi.
baseline_track_bidirectional  = true
# --- §33: la baseline si forma SEMPRE, anche a guida degradata (fix notti brutte RC8) ---
baseline_always_form            = true   # ATTIVO: forma la baseline anche fuori NOMINAL (no piu' None)
baseline_fallback_frames        = 180    # se 60 frame NOMINAL non arrivano entro questi -> fallback
baseline_best_fraction          = 0.33   # baseline = mediana del miglior 33% (P1: meglio raggiungibile)
rms_low_high_ratio_max          = 0.85   # anti-inversione bande: rms_low <= rms_high * questo
baseline_fallback_max_cov       = 0.50   # rifiuta la finestra se instabile (CoV oltre questo)
baseline_fallback_reject_arcsec = 4.0    # tetto "guida rotta": rifiuta baseline oltre
# §40 — il fallback §33 non e' congelabile dalla soglia SNR alta: su notti fioche la
# baseline si forma comunque dai frame meno peggio, escludendo solo implosion e i frame
# sotto il floor anti-garbage. true (shipped) = fallback usa il floor; false = gate §33 stretto.
baseline_fallback_ignores_snr_gate = true
baseline_fallback_min_snr          = 3.0   # floor anti-garbage = reject rilevamento stella PHD2

[lever_optimization]
# §30 (Agente v2.3) — Satisfaction gate sul ramo "guida ottima" del controller.
# Quando l'RMS dell'asse e' gia' al livello della mediana baseline misurata
# sul tuo cielo (o sotto), le leve Aggressivita' e MinMove NON vengono spinte
# verso la reattivita' estrema. Se l'RMS risale sopra la mediana, il gate si
# disattiva automaticamente e le leve riprendono ad essere regolate come prima.
#
# Il gate agisce SOLO nel ramo "guida ottima" (CASO 3). Quando il seeing
# peggiora (RMS sopra rms_high), le leve continuano ad ammorbidirsi come da
# v2.2, fino all'eventuale attivazione dell'esposizione dinamica (path B, §19).
#
enabled        = true
# 1.0 = "ferma se RMS <= mediana". 0.9 = piu' conservativo (ferma anche prima).
# 1.1 = piu' permissivo (lascia esplorare un po' anche sopra mediana).
target_factor  = 1.0
# --- §32: recupero MinMove nella banda morta (anti "leva incollata al floor", OFF/GUARDIAN) ---
minmove_recovery_enabled      = true   # ATTIVO: MinMove risale quando rms entra nella banda morta
minmove_recovery_factor       = 1.0    # recupera finche' rms > mediana baseline * questo
recovery_no_progress_k        = 3      # anti-windup: stop dopo K recuperi senza calo RMS
# --- §53: recupero SIMMETRICO guidato dall'esito (banda morta BIDIREZIONALE) ---
# Chiude l'asimmetria allargamento/recupero. Nella banda morta, se le leve sono più MORBIDE
# dello standard §50 e la guida è STABILE, il motore prova a IRRIGIDIRE verso lo standard
# (aggr SU / MinMove GIÙ), misura l'esito e TIENE se l'RMS regge/migliora; ammorbidisce (§32)
# solo se l'esito prova che serviva (seeing vero). Àncora = valori standard §50; cap §51 =
# tetto in salita. false = comportamento §32 attuale (solo-MinMove verso il morbido, ratchet).
symmetric_recovery_enabled        = true   # born-operative (metodologia live)
recovery_stiffen_aggression       = true   # estende il recupero all'aggressività (oggi senza recupero)
recovery_outcome_window_frames    = 6      # frame su cui giudicare l'esito di un irrigidimento (tarabile)
recovery_outcome_tolerance_factor = 1.05   # rms <= anchor×questo -> "regge" (continua); oltre -> STOP

[diagnostic_engine]
# §31 (Agente v2.4) — Seeing Diagnostic Engine. Diagnosi causale del regime
# (SEEING / OVERCORRECTION / DRIFT / NOMINAL) da jitter + lag-1 + RMS + HFD + trend.
enabled                   = true    # ATTIVO di default in GUARDIAN (richiesta Alessandro). false = v2.3 puro
# "guardian" = MODALITÀ UFFICIALE: la v2.3 pilota; il motore conferma/attenua/blocca le mosse
#              v2.3 e fa micro-correzioni proprie ad ampiezza ridotta solo quando la v2.3 è ferma.
# "jitter"   = DEPRECATA/sperimentale (§54): il motore diventa UNICA AUTORITÀ su Aggr/MinMove
#              (CASO 1/2/3 sospesi) → scavalca tutto il controllore outcome-first validato
#              (§44/§50/§51/§53). Mai validata sul campo. Ricade su GUARDIAN se
#              allow_experimental_jitter=false (vedi sotto).
mode                      = "guardian"
# §54 — sblocca la modalità JITTER deprecata/sperimentale. false (default) = jitter ignorata
# (dashboard o config legacy) e coerciata a GUARDIAN con WARNING. Metterlo a true SOLO per una
# validazione live deliberata e controllata del ramo jitter (che resta dormiente ma funzionante).
allow_experimental_jitter = false
# --- soglie diagnosi (relative alle reference EMA, robuste multi-setup) ---
min_frames                = 30
jitter_high_factor        = 1.6
hfd_high_factor           = 1.25
# §37: HFD declassato a SOLO INFORMATIVO. Sulla camera di guida l'HFD e' cieco al
# seeing (hfd_avg/hfd_ref ~ 1.0 a ogni cielo): faceva da gate AND che azzerava SEEING.
# false (shipped) = HFD NON gatea: SEEING si decide su jitter+RMS; HFD solo loggato + card.
# true = vecchio gate §31 (SEEING richiede anche HFD alto) per confronto A/B.
hfd_gates_seeing          = false
# §38: le reference (jitter_ref/hfd_ref) si formano col best-fraction su finestra mobile
# (i frame piu' calmi), come la baseline §33 — non piu' solo nel raro ramo rms<=rms_low.
# Cosi' jitter_ref si forma sempre e presto e il motore puo' diagnosticare SEEING anche
# nelle notti turbolente. Post-§37 refs_ready dipende SOLO da jitter_ref (HFD informativo).
# true (shipped) = nuova formazione; false = formazione EMA-in-NOMINAL §31 (A/B).
refs_always_form          = true
refs_window_frames        = 120     # ampiezza finestra mobile dei campioni
refs_best_fraction        = 0.25    # quota dei frame piu' calmi usata per la reference
refs_warmup_frames        = 15      # ritardo iniziale; qualita' dal best-fraction su finestra
# §39: i riferimenti di calma sopravvivono a dither/settle (un dither sposta la stella,
# non l'atmosfera) e si azzerano solo a cambio esposizione/pixel-scale/target/restart.
# Elimina il churn "warmup vs cadenza dither" del §38. true (shipped) = preserva;
# false = azzera sempre (comportamento §31, per A/B). Le cause di reset sono loggate
# nella colonna CSV `reset_cause` (schema_version 4).
preserve_refs_on_dither   = true
lag1_oscillation_thresh   = -0.35
trend_drift_min           = 0.05
ema_alpha                 = 0.1
# --- azione ---
act_min_confidence        = 60
outcome_window_frames     = 15
warmup_frames_after_switch = 10
# --- guardian ---
guardian_min_confidence   = 60      # sotto questa confidence il review CONFERMA sempre (fail-safe)
guardian_attenuate_factor = 0.5     # ampiezza ridotta quando il review ATTENUA una mossa v2.3
guardian_action_factor    = 0.4     # ampiezza delle micro-correzioni proprie di guardian (frazione degli step)
# --- UI ---
# false (flotta) = la dashboard puo' solo spegnere (OFF -> v2.3 puro); true (setup di Alessandro) =
# la dashboard puo' anche attivare/commutare jitter/guardian (con conferma).
allow_dashboard_mode_switch = true
# --- §46 N8: fusione confidence con la trasparenza NINA (SOLO diagnosi SEEING) ---
# NINA non comanda le leve: MODULA la fiducia del motore nel SEEING con una penalita'
# PROPORZIONALE al calo % di trasparenza (N1). Effetto solo "astieniti" (abbassa la
# confidence sotto il gate guardian -> a volte una micro-correzione in meno); mai piu'
# aggressivita'. Penalita' = 0 sul rumore (dead-band) e cresce fino a nina_max_penalty;
# scatta solo se il calo e' confermato su >= nina_persist_subs pose (anti frame anomalo).
confidence_use_nina = true     # born-operative; false = confidence PHD2-only (pre-N8)
nina_deadband       = 0.10     # calo % sotto cui penalita' ~0 (rumore frame-to-frame)
nina_full_deficit   = 0.45     # calo % a cui la penalita' e' massima
nina_max_penalty    = 40       # punti di confidence sottratti al deficit pieno
nina_persist_subs   = 2        # pose consecutive di conferma prima di penalizzare
# --- §47: ESPERIMENTO outcome-first — ramo oscillazioni disattivo (reversibile) ---
# false (default, proposta Alessandro 2026-06-21): il motore NON emette azioni leva su
# OVERCORRECTION/lag-1 (stato solo informativo) e il CASO2 v2.3 "oscillazione=trend" e'
# disattivato. Tesi: una vera oscillazione patologica si manifesta comunque come
# peggioramento di RMS/outcome (SEEING-softening, §32, Guardian, §44 restano gli attori).
# La dashboard mostra il breakdown delle sorgenti di softening + quante volte il ramo
# AVREBBE agito (shadow). true = comportamento legacy (ramo oscillazioni attivo).
# Codice dormiente dietro il flag: reversibile, nessuna cancellazione.
oscillation_branch_enabled = false

[nina_telemetry]
# §41 (Step 0) — canale in ingresso per le metriche per-posa di NINA (HFR, conteggio
# stelle, SNR, fondo cielo, eccentricità) inoltrate dal plugin via POST /nina/telemetry.
# OPZIONALE e GRACEFUL: senza POST l'Agente si comporta IDENTICO a oggi. Nessun
# consumatore agisce ancora sui dati (context-gating/trasparenza/safety/confidence =
# N1–N8, feature successive). Lo store è solo esposto in /status.nina per la dashboard.
enabled            = true     # ATTIVO (born-operative, ma inerte senza dati in arrivo).
                              # false = kill-switch: l'endpoint risponde
                              # 200 {"accepted":false,"reason":"disabled"} e non memorizza.
staleness_seconds  = 180.0    # PAVIMENTO della finestra di freschezza (connected=false oltre)
history_frames     = 60       # storico in memoria per future baseline per-campo
log_arrivals       = false    # se true, logga ogni arrivo di telemetria (debug)
# §43a — freschezza ADATTIVA alla posa: effective_window =
# max(staleness_seconds, staleness_exposure_factor × exposure_s ultima posa). Le pose
# sono lunghe (es. 300s) e la telemetria arriva una volta per posa: senza adattività il
# blocco nina andrebbe "disconnesso" per metà di ogni ciclo pur essendo tutto ok.
# 0 = disattiva l'adattività (solo staleness_seconds).
staleness_exposure_factor = 1.5

[nina_indices]
# §45 (N1) — Transparency Index: segnale di trasparenza del cielo ORTOGONALE a PHD2,
# dal conteggio stelle + fondo cielo della camera di RIPRESA. Riferimento SEMPRE
# RELATIVO al campo+filtro corrente (rolling-high su finestra mobile), MAI soglie
# assolute: un campo povero ma STABILE resta CLEAR; un calo % RAPIDO (velature/nubi)
# fa scendere l'indice -> HAZE/CLOUD. NIENTE HFR (domini separati). Graceful: senza
# telemetria l'indice è None e nulla cambia. Consumato da N8 (§46).
enabled               = true     # operativo; false = kill-switch (indice non calcolato)
baseline_window_subs  = 12       # finestra mobile (sotto-pose) del riferimento per-filtro
base_best_fraction    = 0.5      # quota "alta" della finestra = cielo più limpido recente
clear_above           = 0.8      # TI >= -> CLEAR
cloud_below           = 0.5      # TI <  -> CLOUD (in mezzo: HAZE)
hysteresis            = 0.05     # margine anti-flicker sulle soglie di stato
deadband_deficit      = 0.10     # calo % sotto cui è rumore (non conta per confirmed_subs)
