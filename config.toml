#
# Configurazione unica. La scelta del telescopio avviene selezionando
# il profilo dentro PHD2 (focale -> pixel scale auto-rilevata).
# Vedi NOTE_CLAUDE.md sezione 22 per il refactor a config unico.
#
# Per editare un parametro: trovare la sezione, leggere il commento
# inline, modificare il valore. Le sezioni feature-specific (es.
# [auto_calibration], [exposure_dynamic]) hanno default attivi.
#

[setup]
profile_name                     = "auto"
guide_pixel_scale_arcsec_native  = 1.0    # fallback se PHD2 non riporta la scala
guide_pixel_scale_arcsec_reduced = 1.0    # fallback
reducer_active                   = false

[phd2]
host = "localhost"
port = 4400

[dashboard]
host = "0.0.0.0"
port = 8080

[control]
dry_run          = false
interval_seconds = 10
window_frames    = 30
cooldown_seconds = 30
# §34: accumula baseline e popola i campi di logging per OGNI guide-frame (non solo
# sul tick da interval_seconds). Risolve la baseline lenta (~37 -> ~8 min) e
# l'"85% INSUFFICIENT" artefatto (in realta' ~15% sui frame valutati).
per_frame_baseline = true

[analyzer]
# §36 — FIX UNITÀ: le distanze di guida di PHD2 (RADistanceRaw/DECDistanceRaw) sono in
# PIXEL, mentre soglie/cap/reject sono in arcsec. Con true l'ingest converte la misura
# px→arcsec (× pixel-scale viva) così misura e soglie combaciano su tutti i setup
# (RC8 non sovrastima piu', Askar/Mirko non sottostimano). SHIPPED ON: un fix di
# correttezza non gira col bug. false = misura in px (buggato), solo per A/B.
convert_distance_to_arcsec = true

[thresholds]
rms_high           = 1.20   # iniziale/fallback; sovrascritto dall'auto-calibrazione
rms_low            = 0.60   # iniziale/fallback
snr_low            = 8.0    # unificato: sopra il cuscinetto PHD2 (6.0) e il reject (3.0),
                            #            sotto la fascia sana 15-40 -> scatta solo a degrado reale
spike_ratio_high   = 0.30
consecutive_frames = 5

[emergency]
auto_recovery        = true
max_exposure_ms      = 4000   # unificato a 4s per tutti i setup
find_star_delay      = 10
saturation_timeout_s = 300

# Range armonizzati RA/DEC (§24): i due blocchi sono identici.
[limits.ra]
aggr_min       = 35
aggr_max       = 90
aggr_step_down = 5
aggr_step_up   = 2
minmove_min    = 0.15
minmove_max    = 0.85
minmove_step   = 0.05

[limits.dec]
aggr_min       = 35
aggr_max       = 90
aggr_step_down = 5
aggr_step_up   = 2
minmove_min    = 0.15
minmove_max    = 0.85
minmove_step   = 0.05

[logging]
csv_dir   = "logs"
log_level = "INFO"

[phd2_log]
log_dir     = ""
output_dir  = "phd2_log"
auto_import = true

[exposure_dynamic]
enabled               = true
step_factor           = 1.5
max_steps_above_base  = 2
cooldown_s            = 90
spike_min             = 0.25   # unificato (mediana dei 3 setup: 0.30/0.25/0.20)
hfd_min_arcsec        = 4.0    # unificato (mediana dei 3 setup: 4.5/4.0/4.0)
peak_to_rms_ratio_min = 3.0
nominal_for_seconds   = 60
# §35: se Path B alza l'esposizione e la stella SATURA al nuovo tempo, riseleziona
# proattivamente una stella non satura (entro pochi secondi, non i 300s del timer).
restar_on_pathb_saturation = true   # ATTIVO (shipped ON)
pathb_restar_settle_frames = 2      # frame (x durata esposizione) di settle prima del check
pathb_restar_cooldown_s    = 120    # anti-flapping fra riselezioni

[auto_calibration]
enabled                       = true
use_phd2_pixel_scale          = true
# Taratura §25: cuscinetto sopra baseline ridotto dal 50% al 30% per protezione
# focali lunghe (es. RC8 a 0,51"/px, dove 1,5 x baseline tipica = soglie gia' fuori scala).
rms_high_factor               = 1.3        # era 1.5 (§24)
rms_low_factor                = 0.75
baseline_window_frames        = 60
# §40 — 6.0 = pavimento "Minimum star SNR for AutoFind" di default di PHD2 (lo ha ogni
# utente) -> la baseline si forma per tutti. Resta <= snr_low (8): 6 = soglia rilevamento
# stella, 8 = soglia controllo esposizione. Prima 10.0 bloccava le notti a SNR basso.
baseline_min_snr              = 6.0
# --- Clamp proporzionale del cap su rms_high (§23, taratura aggiornata §24) ---
# cap_efficace = clamp(rms_high_max_factor * pixel_scale, rms_high_min_arcsec, rms_high_max_arcsec)
# Tetto a 1,00" allineato al benchmark di "guida pulita" universalmente riconosciuto:
# risolve il caso cercatore-guida (focale di guida != imaging) impedendo che la pixel scale
# grossolana del cercatore porti a soglie troppo lasche per l'ottica di ripresa.
# Effetto: su RC8/Tecnosky/Askar il cap risulta 1,00" (il proporzionale verrebbe 1,02/2,06/3,16 -> troncato).
rms_high_max_factor           = 2.0
rms_high_min_arcsec           = 0.70
rms_high_max_arcsec           = 1.00
# Floor su rms_low:
rms_low_min_arcsec            = 0.25
# --- Gate di rifiuto baseline (§23) ---
# reject se baseline > max(baseline_reject_min_arcsec, baseline_reject_factor * pixel_scale)
# Esempi: RC8 reject > 1,53"; Tecnosky > 3,09"; Askar > 4,74".
baseline_reject_factor        = 3.0
baseline_reject_min_arcsec    = 1.50
# --- Refresh ciclico baseline (§25) ---
# La baseline si ri-misura ogni refresh_interval_seconds; la nuova sostituisce
# la corrente SOLO se piu' stretta ("tightest-wins"). L'Agente non concede mai
# terreno al peggioramento del cielo, ma si adatta quando il cielo migliora.
refresh_enabled               = true
refresh_interval_seconds      = 1800.0     # 30 minuti
refresh_only_if_tighter       = true
# --- §33: la baseline si forma SEMPRE, anche a guida degradata (fix notti brutte RC8) ---
baseline_always_form            = true   # ATTIVO: forma la baseline anche fuori NOMINAL (no piu' None)
baseline_fallback_frames        = 180    # se 60 frame NOMINAL non arrivano entro questi -> fallback
baseline_best_fraction          = 0.33   # baseline = mediana del miglior 33% (P1: meglio raggiungibile)
rms_low_high_ratio_max          = 0.85   # anti-inversione bande: rms_low <= rms_high * questo
baseline_fallback_max_cov       = 0.50   # rifiuta la finestra se instabile (CoV oltre questo)
baseline_fallback_reject_arcsec = 4.0    # tetto "guida rotta": rifiuta baseline oltre
# §40 — il fallback §33 non e' congelabile dalla soglia SNR alta: su notti fioche la
# baseline si forma comunque dai frame meno peggio, escludendo solo implosion e i frame
# sotto il floor anti-garbage. true (shipped) = fallback usa il floor; false = gate §33 stretto.
baseline_fallback_ignores_snr_gate = true
baseline_fallback_min_snr          = 3.0   # floor anti-garbage = reject rilevamento stella PHD2

[lever_optimization]
# §30 (Agente v2.3) — Satisfaction gate sul ramo "guida ottima" del controller.
# Quando l'RMS dell'asse e' gia' al livello della mediana baseline misurata
# sul tuo cielo (o sotto), le leve Aggressivita' e MinMove NON vengono spinte
# verso la reattivita' estrema. Se l'RMS risale sopra la mediana, il gate si
# disattiva automaticamente e le leve riprendono ad essere regolate come prima.
#
# Il gate agisce SOLO nel ramo "guida ottima" (CASO 3). Quando il seeing
# peggiora (RMS sopra rms_high), le leve continuano ad ammorbidirsi come da
# v2.2, fino all'eventuale attivazione dell'esposizione dinamica (path B, §19).
#
enabled        = true
# 1.0 = "ferma se RMS <= mediana". 0.9 = piu' conservativo (ferma anche prima).
# 1.1 = piu' permissivo (lascia esplorare un po' anche sopra mediana).
target_factor  = 1.0
# --- §32: recupero MinMove nella banda morta (anti "leva incollata al floor", OFF/GUARDIAN) ---
minmove_recovery_enabled      = true   # ATTIVO: MinMove risale quando rms entra nella banda morta
minmove_recovery_factor       = 1.0    # recupera finche' rms > mediana baseline * questo
recovery_no_progress_k        = 3      # anti-windup: stop dopo K recuperi senza calo RMS

[diagnostic_engine]
# §31 (Agente v2.4) — Seeing Diagnostic Engine. Diagnosi causale del regime
# (SEEING / OVERCORRECTION / DRIFT / NOMINAL) da jitter + lag-1 + RMS + HFD + trend.
enabled                   = true    # ATTIVO di default in GUARDIAN (richiesta Alessandro). false = v2.3 puro
# "jitter"   = controllo causale completo: il motore e' UNICA AUTORITA' su Aggr/MinMove (CASO 1/2/3 sospesi) — ricerca
# "guardian" = assistito: la v2.3 pilota; il motore conferma/attenua/blocca le mosse v2.3 e fa
#              micro-correzioni proprie ad ampiezza ridotta solo quando la v2.3 e' ferma — distribuibile
mode                      = "guardian"
# --- soglie diagnosi (relative alle reference EMA, robuste multi-setup) ---
min_frames                = 30
jitter_high_factor        = 1.6
hfd_high_factor           = 1.25
# §37: HFD declassato a SOLO INFORMATIVO. Sulla camera di guida l'HFD e' cieco al
# seeing (hfd_avg/hfd_ref ~ 1.0 a ogni cielo): faceva da gate AND che azzerava SEEING.
# false (shipped) = HFD NON gatea: SEEING si decide su jitter+RMS; HFD solo loggato + card.
# true = vecchio gate §31 (SEEING richiede anche HFD alto) per confronto A/B.
hfd_gates_seeing          = false
# §38: le reference (jitter_ref/hfd_ref) si formano col best-fraction su finestra mobile
# (i frame piu' calmi), come la baseline §33 — non piu' solo nel raro ramo rms<=rms_low.
# Cosi' jitter_ref si forma sempre e presto e il motore puo' diagnosticare SEEING anche
# nelle notti turbolente. Post-§37 refs_ready dipende SOLO da jitter_ref (HFD informativo).
# true (shipped) = nuova formazione; false = formazione EMA-in-NOMINAL §31 (A/B).
refs_always_form          = true
refs_window_frames        = 120     # ampiezza finestra mobile dei campioni
refs_best_fraction        = 0.25    # quota dei frame piu' calmi usata per la reference
refs_warmup_frames        = 15      # ritardo iniziale; qualita' dal best-fraction su finestra
# §39: i riferimenti di calma sopravvivono a dither/settle (un dither sposta la stella,
# non l'atmosfera) e si azzerano solo a cambio esposizione/pixel-scale/target/restart.
# Elimina il churn "warmup vs cadenza dither" del §38. true (shipped) = preserva;
# false = azzera sempre (comportamento §31, per A/B). Le cause di reset sono loggate
# nella colonna CSV `reset_cause` (schema_version 4).
preserve_refs_on_dither   = true
lag1_oscillation_thresh   = -0.35
trend_drift_min           = 0.05
ema_alpha                 = 0.1
# --- azione ---
act_min_confidence        = 60
outcome_window_frames     = 15
warmup_frames_after_switch = 10
# --- guardian ---
guardian_min_confidence   = 60      # sotto questa confidence il review CONFERMA sempre (fail-safe)
guardian_attenuate_factor = 0.5     # ampiezza ridotta quando il review ATTENUA una mossa v2.3
guardian_action_factor    = 0.4     # ampiezza delle micro-correzioni proprie di guardian (frazione degli step)
# --- UI ---
# false (flotta) = la dashboard puo' solo spegnere (OFF -> v2.3 puro); true (setup di Alessandro) =
# la dashboard puo' anche attivare/commutare jitter/guardian (con conferma).
allow_dashboard_mode_switch = true
