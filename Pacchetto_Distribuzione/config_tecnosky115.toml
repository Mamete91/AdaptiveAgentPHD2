# =============================================================================
# CONFIG: Tecnosky 115/800 + ASI2600 + OAG ASI220 Mini
# =============================================================================
# Focale: 800 mm nativo (640 mm con riduttore 0.8x)
# Pixel scale imaging: 0.97"/px (1.21"/px ridotto)
# OAG: ASI220MM Mini (sensore SC2210, pixel 4.0 µm, 1920x1080)
# Pixel scale guida (OAG): 1.03"/px (1.29"/px ridotto)
#
# Montatura: AM5 o CEM70G (entrambe vanno bene a questa focale)
# Setup di ripresa per: deep-sky medio campo, nebulose grandi
#
# NOTA TARATURA SOGLIE:
# A focale media (800mm) un RMS di 0.6-0.8" e' tipicamente non visibile come
# elongation nel sub finale. Le soglie sono piu' permissive rispetto al RC8.
# =============================================================================

[setup]
profile_name                     = "tecnosky115"
guide_pixel_scale_arcsec_native  = 1.03   # Tecnosky 115 nativo
guide_pixel_scale_arcsec_reduced = 1.29   # con riduttore 0.80x (1.03/0.80)
reducer_active                   = false

[phd2]
host = "localhost"
port = 4400

[dashboard]
host = "0.0.0.0"
port = 8080

[control]
dry_run = false   # LIVE — validazione §21 (exposure dynamic path B)
interval_seconds = 10
window_frames = 30
cooldown_seconds = 30

[thresholds]
# Tarate per Tecnosky 115 (focale media)
rms_high           = 1.00   # > 1.0" RMS = degraded per questo setup
rms_low            = 0.55   # < 0.55" RMS = ottimo
snr_low            = 9.0
spike_ratio_high   = 0.30
consecutive_frames = 5

[emergency]
auto_recovery        = true
max_exposure_ms      = 5000   # 5s sufficienti a focale media
find_star_delay      = 10
saturation_timeout_s = 300

[limits.ra]
# A focale media si possono permettere step leggermente piu' incisivi
aggr_min       = 40
aggr_max       = 80
aggr_step_down = 5
aggr_step_up   = 2
minmove_min    = 0.15
minmove_max    = 0.80
minmove_step   = 0.05

[limits.dec]
aggr_min       = 35
aggr_max       = 75
aggr_step_down = 5
aggr_step_up   = 2
minmove_min    = 0.18
minmove_max    = 0.85
minmove_step   = 0.05

[logging]
csv_dir   = "logs"
log_level = "INFO"

[phd2_log]
log_dir     = ""        # cartella log PHD2 (vuoto = scoperta automatica)
output_dir  = "phd2_log"
auto_import = true

[exposure_dynamic]
# Su Tecnosky 115 (1.03"/px nativo) il beneficio e' marginale ma reale in
# nottate turbolente. Default OFF, attivabile in fase di test.
enabled                  = true    # LIVE — attivo per §21
# (guide_pixel_scale_arcsec spostato in [setup])
step_factor              = 1.5
max_steps_above_base     = 2
cooldown_s               = 90
spike_min                = 0.25
hfd_min_arcsec           = 4.0
peak_to_rms_ratio_min    = 3.0
nominal_for_seconds      = 60
