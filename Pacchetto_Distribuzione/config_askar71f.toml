# =============================================================================
# CONFIG: Askar 71F + ASI2600 + OAG ASI120 Mini
# =============================================================================
# Focale: 490 mm nativo (367 mm con riduttore 0.75x)
# Pixel scale imaging: 1.58"/px (2.11"/px ridotto, riduttore 0.75x)
# OAG: ASI120MM Mini (sensore AR0130CS, pixel 3.75 µm, 1280x960)
# Pixel scale guida (OAG): 1.58"/px (2.11"/px ridotto, riduttore 0.75x)
#
# Montatura: AM5 (ideale per focale corta) o CEM70G
# Setup di ripresa per: ampi campi, mosaici, complessi nebulari grandi
#
# NOTA TARATURA SOGLIE:
# A focale corta (490mm) un RMS di 1.0-1.5" e' praticamente invisibile nel sub.
# Le soglie sono molto permissive: l'agente reagira' solo a degrado importante.
# Questo e' il setup IDEALE per le prime sessioni di test dell'agente in LIVE,
# perche' gli errori del controller sono tollerati dalla scala generosa.
# =============================================================================

[setup]
profile_name                     = "askar71f"
guide_pixel_scale_arcsec_native  = 1.58   # Askar 71F nativo
guide_pixel_scale_arcsec_reduced = 2.11   # con riduttore 0.75x (1.58/0.75)
reducer_active                   = false

[phd2]
host = "localhost"
port = 4400

[dashboard]
host = "0.0.0.0"
port = 8080

[control]
dry_run = false   # LIVE — validazione §21 (exposure dynamic path B)
interval_seconds = 10
window_frames = 30
cooldown_seconds = 30

[thresholds]
# Tarate per Askar 71F (focale corta, scala generosa)
rms_high           = 1.30   # > 1.3" RMS = degraded per questo setup
rms_low            = 0.70   # < 0.70" RMS = ottimo
snr_low            = 9.0
spike_ratio_high   = 0.30
consecutive_frames = 5

[emergency]
auto_recovery        = true
max_exposure_ms      = 4000   # focale corta = stelle guida luminose
find_star_delay      = 10
saturation_timeout_s = 300

[limits.ra]
# Focale corta = tolleranza molto piu' alta su correzioni
aggr_min       = 40
aggr_max       = 85
aggr_step_down = 5
aggr_step_up   = 3       # leggermente piu' rapido nel risalire
minmove_min    = 0.15
minmove_max    = 0.80
minmove_step   = 0.05

[limits.dec]
aggr_min       = 35
aggr_max       = 80
aggr_step_down = 5
aggr_step_up   = 3
minmove_min    = 0.18
minmove_max    = 0.85
minmove_step   = 0.05

[logging]
csv_dir   = "logs"
log_level = "INFO"

[phd2_log]
log_dir     = ""        # cartella log PHD2 (vuoto = scoperta automatica)
output_dir  = "phd2_log"
auto_import = true

[exposure_dynamic]
# Su Askar 71F (1.58"/px nativo) il beneficio e' marginale: la scala di guida
# e' gia' abbastanza generosa da rendere l'integrazione via esposizione poco
# influente. Default OFF, da attivare solo per esperimenti.
enabled                  = true    # LIVE — attivo per §21
# (guide_pixel_scale_arcsec spostato in [setup])
step_factor              = 1.5
max_steps_above_base     = 2
cooldown_s               = 90
spike_min                = 0.30
hfd_min_arcsec           = 4.5
peak_to_rms_ratio_min    = 3.0
nominal_for_seconds      = 60
