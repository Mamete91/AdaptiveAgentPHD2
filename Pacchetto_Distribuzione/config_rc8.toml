# =============================================================================
# CONFIG: RC8 + ASI2600 + OAG ASI220 Mini
# =============================================================================
# Focale: 1624 mm nativo (1218 mm con riduttore 0.75x)
# Pixel scale imaging: 0.48"/px (0.64"/px ridotto, riduttore 0.75x)
# OAG: ASI220MM Mini (sensore SC2210, pixel 4.0 µm, 1920x1080)
# Pixel scale guida (OAG): 0.51"/px (0.68"/px ridotto, riduttore 0.75x)
#
# Montatura raccomandata: CEM70G (su AM5 RMS difficilmente sotto 1")
# Setup di ripresa per: deep-sky a lunga focale, target piccoli
#
# NOTA TARATURA SOGLIE:
# A lunga focale (1624mm) il seeing italiano limita spesso l'RMS minimo a
# 0.5-0.7" anche su CEM70G. Le soglie sono state fissate per riconoscere
# come "degradato" un RMS che e' patologico per questo setup, e come
# "ottimo" un RMS che e' realisticamente raggiungibile in notti buone.
#
# DOPO 2-3 SESSIONI DI USO REALE, ricalibrare:
#   rms_high = 1.5 x RMS_medio_tipico
#   rms_low  = 0.7 x RMS_medio_tipico
# =============================================================================

[setup]
profile_name                     = "rc8"
guide_pixel_scale_arcsec_native  = 0.51   # RC8 nativo
guide_pixel_scale_arcsec_reduced = 0.68   # con riduttore 0.75x (0.51/0.75)
reducer_active                   = false

[phd2]
host = "localhost"
port = 4400

[dashboard]
host = "0.0.0.0"
port = 8080

# CONFIGURAZIONE DI VALIDAZIONE LIVE
# dry_run = false → comandi reali a PHD2 (non cambiare)
# exposure_dynamic.enabled = true → path B attivo per osservare i trigger sulla dashboard
# La sicurezza e' garantita dall'escalation gate (path B non scatta finche'
# aggressiveness/MinMove non hanno saturato i loro limiti) e da max_steps_above_base=2.
[control]
dry_run = false
interval_seconds = 10
window_frames = 30
cooldown_seconds = 30

[thresholds]
# Tarate per RC8 con CEM70G da Borno (montagna)
rms_high           = 0.85   # > 0.85" RMS = seeing degradato per questo setup
rms_low            = 0.50   # < 0.50" RMS = seeing molto buono
snr_low            = 8.0    # Soglia SNR critica (in OAG con narrowband
                            # 3nm e' realistico abbassare a 8 invece di 10)
spike_ratio_high   = 0.30
consecutive_frames = 5

[emergency]
auto_recovery        = true
max_exposure_ms      = 6000   # 6s max per OAG con narrowband 3nm Scorpio
                              # (con SHO a 1624mm le stelle guida sono deboli)
find_star_delay      = 10
saturation_timeout_s = 300

[limits.ra]
# RC8 e' sensibile alle correzioni RA per la lunga focale
# Uso step conservativi
aggr_min       = 35
aggr_max       = 75      # cap a 75 per evitare overshoot
aggr_step_down = 5
aggr_step_up   = 2
minmove_min    = 0.15    # in pixel guida (con scala 0.51"/px = 0.08")
minmove_max    = 0.80
minmove_step   = 0.05

[limits.dec]
# DEC piu' conservativo perche' la CEM70G ha backlash misurabile
aggr_min       = 30
aggr_max       = 70
aggr_step_down = 5
aggr_step_up   = 2
minmove_min    = 0.20    # MinMove DEC leggermente piu' alto per assorbire backlash
minmove_max    = 0.85
minmove_step   = 0.05

[logging]
csv_dir   = "logs"
log_level = "INFO"

[phd2_log]
log_dir     = ""        # cartella log PHD2 (vuoto = scoperta automatica)
output_dir  = "phd2_log"
auto_import = true

[exposure_dynamic]
# Su RC8 (0.51"/px nativo) il seeing entra dritto nel sub di guida e
# l'integrazione via esposizione e' una leva potente. Attivato per validazione LIVE.
enabled                  = true
# (guide_pixel_scale_arcsec spostato in [setup])
step_factor              = 1.5
max_steps_above_base     = 2
cooldown_s               = 90
spike_min                = 0.20
hfd_min_arcsec           = 4.0
peak_to_rms_ratio_min    = 3.0
nominal_for_seconds      = 60
